name: Build

# 自动构建开发版模块 zip，并作为 workflow artifact 提供下载（保留 90 天）。
# 产物名带 commit 标识，可追溯；发布由维护者手动完成（见 README「开发与发布」）。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取短 SHA
        id: vars
        run: echo "short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Shell 语法检查
        run: |
          fail=0
          # 覆盖入口、库层（lib/）、工具与断言脚本
          for f in *.sh lib/*.sh tools/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "✅ $f"
            else
              echo "❌ $f"
              fail=1
            fi
          done
          exit $fail

      - name: 元数据校验（module.prop / update.json）
        run: python3 scripts/check_metadata.py

      # 断言里的 mock 时间源需要一个真实 busybox 承接其余 applet
      - name: 准备 busybox（断言的 mock 时间源要用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          busybox | head -n1

      - name: 层序检查（一层只能引用更早加载的层）
        run: sh tools/check-layer-order.sh

      - name: 运行断言（不需要手机 / root / 网络）
        run: sh tools/run-tests.sh

      - name: 构建模块 zip（开发版）
        run: sh build.sh dev

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fafu-checkin-dev-${{ steps.vars.outputs.short_sha }}
          path: dist/*.zip
          if-no-files-found: error
