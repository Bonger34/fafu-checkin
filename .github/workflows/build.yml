name: Build

# 自动构建开发版模块 zip，并作为 workflow artifact 提供下载（保留 90 天）。
# 产物名带 commit 标识，可追溯；发布由维护者手动完成（见 README「开发与发布」）。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取短 SHA
        id: vars
        run: echo "short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Shell 语法检查
        run: |
          fail=0
          # 覆盖入口、库层（lib/）、工具与断言脚本
          for f in *.sh lib/*.sh tools/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "✅ $f"
            else
              echo "❌ $f"
              fail=1
            fi
          done
          exit $fail

      - name: 元数据校验（module.prop / update.json）
        run: python3 scripts/check_metadata.py

      # 断言里的 mock 时间源需要一个真实 busybox 承接其余 applet。
      # 用 **KernelSU 随附的那一份**（设备上的 /data/adb/ksu/bin/busybox 就是它）：
      # 开发与生产同一份构建，busybox 的能力差异（可选特性、applet 支持）才会在 CI
      # 暴露，而不是刷机之后才发现。x86_64 那份是静态 ELF，ubuntu 上可直接跑；
      # 按 commit 钉住，上游一改不会让基线悄悄漂移。
      # **文件名必须正好是 `busybox`**：它按 argv[0] 分派 applet，改个名字就全废了。
      - name: 准备 busybox（与设备同一份构建：KernelSU 随附）
        run: |
          curl -fsSL --retry 3 -o /usr/local/bin/busybox \
            https://raw.githubusercontent.com/tiann/KernelSU/40e8fb7616bfd875babb45364f5262657538327a/userspace/ksud/bin/x86_64/busybox
          chmod +x /usr/local/bin/busybox
          /usr/local/bin/busybox | head -n1
          # 把这份 busybox 的可选能力打进日志：`%N` 编没编进去直接决定「耗时」是毫秒还是秒，
          # 这种差异要看得见，不靠猜。
          printf 'date +%%s%%3N => %s\n' "$(/usr/local/bin/busybox date +%s%3N)"
          printf 'TEST_BUSYBOX=/usr/local/bin/busybox\n' >> "$GITHUB_ENV"

      - name: 诊断 · 设备 busybox 上跑模块真正用的那几条命令
        run: |
          B=/usr/local/bin/busybox
          probe() { printf '%s' "$2" | $B $3 > /tmp/o 2>/tmp/e; printf 'rc=%s out=[%s] err=[%s]\n' "$?" "$(cat /tmp/o)" "$(cat /tmp/e)"; }
          echo "== 1 json_first 的形态（字符串字段） =="
          probe x '{"records":[{"id":7,"name":"晚查寝签到"}]}' "grep -oE \"name\":(\"[^\"]*\"|[^,}]*)" || true
          echo "== 2 同一模式取数字字段 =="
          probe x '{"records":[{"id":7,"name":"x"}]}' "grep -oE \"id\":(\"[^\"]*\"|[^,}]*)" || true
          echo "== 3 只用第一个分支（带引号） =="
          probe x '{"id":"7"}' "grep -oE \"id\":\"[^\"]*\"" || true
          echo "== 4 只用第二个分支（不带引号） =="
          probe x '{"id":7}' "grep -oE \"id\":[^,}]*" || true
          echo "== 5 普通 -oE =="
          probe x 'a1b2' "grep -oE [0-9]" || true
          echo "== 6 grep -m1 + cut =="
          probe x 'sign_date=2026-10-12' "grep -m1 ^sign_date=" || true
          echo "== 7 date / tr / base64 / md5sum =="
          $B date +%s%3N || true
          printf 'x' | $B tr -d '\n' | $B base64 | $B md5sum | $B cut -d' ' -f1 || true
          $B head -c 24 /dev/urandom | $B base64 | $B tr -dc 'A-Za-z0-9' | $B head -c 16; echo
          echo "== 版本 =="
          $B | head -n1
          exit 0

      - name: 层序检查（一层只能引用更早加载的层）
        run: sh tools/check-layer-order.sh

      - name: 运行断言（不需要手机 / root / 网络）
        run: sh tools/run-tests.sh

      - name: 构建模块 zip（开发版）
        run: sh build.sh dev

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fafu-checkin-dev-${{ steps.vars.outputs.short_sha }}
          path: dist/*.zip
          if-no-files-found: error
