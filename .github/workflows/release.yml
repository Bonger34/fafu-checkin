name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 构建模块 zip 并创建 GitHub Release
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验 tag 与 module.prop 版本一致
        run: |
          VER=$(sed -n 's/^version=//p' module.prop | head -n 1)
          echo "module.prop: ${VER}"
          echo "tag:         ${GITHUB_REF_NAME}"
          if [ "$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::module.prop 版本与 tag 不一致，请先同步版本号"
            exit 1
          fi

      - name: 构建模块 zip
        run: sh build.sh

      - name: 生成 Release 说明（取自 CHANGELOG 对应小节）
        run: |
          VER="${GITHUB_REF_NAME}"
          awk -v hdr="## ${VER}" '
            $0 == hdr { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            printf '### %s\n\n详见仓库 CHANGELOG。\n' "$VER" > release_body.md
          fi
          {
            echo ""
            echo "---"
            echo "### 📦 安装"
            echo "1. 下载 \`fafu-checkin-${VER}.zip\`"
            echo "2. KernelSU / Magisk 管理器 → 模块 → 从本地安装 → 选择 zip（或管理器内直接更新）"
            echo "3. 重启手机"
          } >> release_body.md
          echo "---------- release body ----------"
          cat release_body.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release_body.md

  # 同步 update.json（管理器据此检测更新）
  sync-update-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 同步 update.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VC=$(git show "${TAG}:module.prop" | sed -n 's/^versionCode=//p' | head -n 1)
          if [ -z "$VC" ]; then
            echo "::error::无法从 ${TAG} 读取 versionCode"
            exit 1
          fi
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fafu-checkin-${TAG}.zip"
          python3 scripts/sync_update_json.py "$TAG" "$VC" "$ZIP_URL"
          if git diff --quiet -- update.json; then
            echo "update.json 已是目标状态，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore(release): 同步 update.json 至 ${TAG}"
          git push origin main
