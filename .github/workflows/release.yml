name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 构建模块 zip 并创建 GitHub Release
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 与 module.prop 版本一致
        run: |
          VER=$(sed -n 's/^version=//p' module.prop | head -n 1)
          echo "module.prop: ${VER}"
          echo "tag:         ${GITHUB_REF_NAME}"
          if [ "$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::module.prop 版本与 tag 不一致，请先同步版本号"
            exit 1
          fi

      - name: 构建模块 zip
        run: sh build.sh

      - name: 生成发布说明（CHANGELOG 小节 + 安装步骤）
        run: |
          VER="${GITHUB_REF_NAME}"
          # 1) 提取 CHANGELOG 中对应版本的小节（从 "## vX.Y.Z" 到下一个 "## "）
          awk -v hdr="## ${VER}" '
            $0 == hdr { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/section.md

          # 2) 去除小节首尾空行
          awk 'NF { p = 1 } p' /tmp/section.md | tac | awk 'NF { p = 1 } p' | tac > /tmp/section_clean.md

          # 3) 组装发布说明：更新内容 + 安装步骤 + 链接
          {
            echo "## 更新内容"
            echo ""
            if [ -s /tmp/section_clean.md ]; then
              cat /tmp/section_clean.md
            else
              echo "本次更新详见 [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
            fi
            echo ""
            echo "---"
            echo ""
            echo "### 📦 安装"
            echo "1. 下载 \`fafu-checkin-${VER}.zip\`"
            echo "2. KernelSU / Magisk 管理器 → 模块 → 从本地安装 → 选择 zip（或管理器内直接更新）"
            echo "3. 重启手机"
            echo ""
            echo "> 完整说明见 [README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md) · 历史更新见 [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > release_body.md

          echo "---------- 发布说明 ----------"
          cat release_body.md

      - name: 解析发布标题（取自 tag 注释）
        id: meta
        run: |
          TITLE=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          if [ -z "$TITLE" ]; then
            TITLE="${GITHUB_REF_NAME}"
          fi
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "发布标题: ${TITLE}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.title }}
          files: dist/*.zip
          body_path: release_body.md

  # 同步 update.json（管理器据此检测更新）
  sync-update-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 同步 update.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VC=$(git show "${TAG}:module.prop" | sed -n 's/^versionCode=//p' | head -n 1)
          if [ -z "$VC" ]; then
            echo "::error::无法从 ${TAG} 读取 versionCode"
            exit 1
          fi
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fafu-checkin-${TAG}.zip"
          python3 scripts/sync_update_json.py "$TAG" "$VC" "$ZIP_URL"
          if git diff --quiet -- update.json; then
            echo "update.json 已是目标状态，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore(release): 同步 update.json 至 ${TAG}"
          git push origin main
