name: Check

# 仅做校验（语法 + 元数据 + 断言），不构建、不发布。
# 构建产物请见 Build 工作流。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell 语法检查
        run: |
          fail=0
          # 库层目录（lib/）在重构中引入；目录还不存在时通配符为空，不影响检查
          for f in *.sh lib/*.sh tools/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "✅ $f"
            else
              echo "❌ $f"
              fail=1
            fi
          done
          exit $fail

      - name: 元数据校验（module.prop / update.json）
        run: python3 scripts/check_metadata.py

      # 断言里的 mock 时间源需要一个真实 busybox 承接其余 applet
      - name: 准备 busybox（断言的 mock 时间源要用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          busybox | head -n1

      - name: 层序检查（一层只能引用更早加载的层）
        run: sh tools/check-layer-order.sh

      - name: 运行断言（不需要手机 / root / 网络）
        run: sh tools/run-tests.sh
