name: CI

# check 单独放在 check.yml（`on: workflow_call`），由这里与 release-build.yml 共用，
# 断言只有一份实现；build 只在 PR / main / 手动时出 dev 包，发布包见 release-build.yml。
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    # 打包与架构无关：build.sh 只依赖 zip/unzip，产物是 shell 脚本 + 页面。
    # 与 check 同用 26.04 arm64，少一个环境变量；26.04 arm64 镜像自带 zip/unzip。
    needs: check
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR 上按 head 仓库 + head 提交检出；push / 手动触发沿用默认值
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 获取短 SHA
        id: vars
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short_sha=$(printf '%s' "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: 构建模块 zip（开发版）
        env:
          # 包名与包内版本串用同一个短 SHA；PR 上它是 head，不是 GitHub 的合并提交
          DEV_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh build.sh dev

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fafu-checkin-dev-${{ steps.vars.outputs.short_sha }}
          path: dist/*.zip
          if-no-files-found: error
